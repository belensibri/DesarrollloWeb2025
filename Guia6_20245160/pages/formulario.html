<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Manejando eventos</title>
</head>

<body>
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="../indexFunciones.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="../img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar">
                        <li class="text-center">
                            <a href="recursividad.html" class="nav-link text-white">
                                <i class="bi bi-arrow-clockwise bi-2 d-block"></i>
                                Recursividad
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="tabla.html" class="nav-link text-white">
                                <i class="bi bi-table bi-2 d-block"></i>
                                Creando una Tabla
                            </a>
                        </li>
                        <li class="text-center nav-bar-li-active">
                            <a href="formulario.html" class="nav-link text-white">
                                <i class="bi bi-ui-checks bi-2 d-block"></i>
                                Formulario
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <div class="container-lg">
        <div class="row">
            <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
                <h3>Expediente médico</h3>
                <form id="idForm">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtNombre" placeholder="Nombre del paciente" />
                                <label for="idTxtNombre">
                                    <i class="bi bi-person-circle"></i> Nombre del paciente
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtApellido" placeholder="Apellido del paciente" />
                                <label for="idTxtApellido">
                                    <i class="bi bi-person-circle"></i> Apellido del paciente
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating">
                                <input type="date" class="form-control" id="idTxtFechaNacimiento" placeholder="Fecha nacimiento" pattern="\d{2}-\d{2}-\d{4}" />
                                <label for="idTxtFechaNacimiento">
                                    <i class="bi bi-calendar-date"></i> Fecha nacimiento
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rdSexo" id="idRdMasculino" />
                            <label class="form-check-label" for="idRdMasculino">
                                Hombre
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rdSexo" id="idRdFemenino" />
                            <label class="form-check-label" for="idRdFemenino">
                                Mujer
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 pt-3">
                            <select class="form-select" aria-label="país" id="idCmPais">
                                <option value="0" selected>Seleccione un País</option>
                                <option value="1">El Salvador</option>
                                <option value="2">Honduras</option>
                                <option value="3">Panamá</option>
                                <option value="4">Costa Rica</option>
                                <option value="5">Belice</option>
                                <option value="6">Nicaragua</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12 pt-3">
                            <div class="form-floating">
                                <textarea class="form-control" placeholder="Dirección" id="idTxtDireccion" rows="4"></textarea>
                                <label for="idTxtDireccion">
                                    <i class="bi bi-geo"></i> Dirección
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-12 pt-3">
                            <button id="idBtnGuardar" type="button" class="btn btn-success">
                                <i class="bi bi-person-plus-fill"></i> Guardar Datos
                            </button>
                            <button id="idBtnMostrar" type="button" class="btn btn-warning">
                                <i class="bi bi-people"></i> Mostrar personas
                            </button>
                            <button id="idBtnLimpiar" type="button" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Limpiar formulario
                            </button>
                        </div>
                    </div>
                    <button id="idBtnRegresarPais" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#idModalAgregarPais">
                        <i class="bi bi-map-fill"></i> Nuevo País
                    </button>
                </form>
            </div>
        </div>

        <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
            <h3>Pacientes registrados</h3>
            <div id="idTablaPacientes">
                Ninguno
            </div>
        </div>
    </div>

    <!-- SECCION DE VALIDACION CON EXPRESIONES REGULARES -->
    <div class="container-lg mt-5 mb-5">
        <div class="row">
            <div class="col-12 shadow-lg p-3 bg-body rounded">
                <h3>Validación de Ficha de Estudiante</h3>
                <p class="text-muted">Ingrese los datos del estudiante. Todos los campos serán validados con expresiones regulares.</p>
                
                <form id="idFormEstudiante">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtCarnet" placeholder="Carnet (AB001)" />
                                <label for="idTxtCarnet">
                                    <i class="bi bi-card-text"></i> Carnet (Ej: AB001)
                                </label>
                                <small class="text-danger" id="idErrorCarnet"></small>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtNombreCompleto" placeholder="Nombre completo" />
                                <label for="idTxtNombreCompleto">
                                    <i class="bi bi-person"></i> Nombre Completo
                                </label>
                                <small class="text-danger" id="idErrorNombre"></small>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtDUI" placeholder="DUI (########-#)" />
                                <label for="idTxtDUI">
                                    <i class="bi bi-file-text"></i> DUI (Ej: 12345678-9)
                                </label>
                                <small class="text-danger" id="idErrorDUI"></small>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtNIT" placeholder="NIT (####-######-###-#)" />
                                <label for="idTxtNIT">
                                    <i class="bi bi-file-text"></i> NIT (Ej: 1234-567890-123-4)
                                </label>
                                <small class="text-danger" id="idErrorNIT"></small>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="date" class="form-control" id="idTxtFechaNacimientoEst" placeholder="Fecha de nacimiento" />
                                <label for="idTxtFechaNacimientoEst">
                                    <i class="bi bi-calendar"></i> Fecha de Nacimiento
                                </label>
                                <small class="text-danger" id="idErrorFecha"></small>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtCorreo" placeholder="correo@ejemplo.com" />
                                <label for="idTxtCorreo">
                                    <i class="bi bi-envelope"></i> Correo Electrónico
                                </label>
                                <small class="text-danger" id="idErrorCorreo"></small>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="idTxtEdad" placeholder="Edad" />
                                <label for="idTxtEdad">
                                    <i class="bi bi-calendar-check"></i> Edad
                                </label>
                                <small class="text-danger" id="idErrorEdad"></small>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-12 pt-3">
                            <button id="idBtnValidar" type="button" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Validar Datos
                            </button>
                            <button id="idBtnLimpiarEst" type="button" class="btn btn-secondary">
                                <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                            </button>
                        </div>
                    </div>
                </form>

                <div id="idResultadoValidacion" class="mt-4"></div>
            </div>
        </div>
    </div>

    <!-- COMPONENTE MODAL DE BOOTSTRAP -->
    <div class="modal fade" id="idModalAgregarPais" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalLabel">Agregando nuevo país</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="idFormPais">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="idNombrePais" placeholder="Nombre del país" />
                            <label for="idNombrePais">
                                <i class="bi bi-map"></i> Nombre del país
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="idBtnAnadirPais" data-bs-dismiss="modal">
                        <i class="bi bi-plus-circle"></i> Agregar país
                    </button>
                </div>
            </div>
        </div>
    </div>
          

    <!-- PERMITTE MOSTRAR NOTIFICACIONES -->
    <div class="toast-container top-8 start-50 translate-middle-x pt-4 mt-1" style="z-index: 1035;">
        <div id="idNotificacion" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi bi-bell"></i>
                <div class="toast-title ms-auto">Notificación</div>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="idMensaje"></div>
        </div>
    </div>

                  
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/formulario.js" defer></script>
</body>

</html>
